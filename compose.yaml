services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://secretfabric:change-me@postgres:5432/secretfabric
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secretfabric
      POSTGRES_USER: secretfabric
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretfabric -d secretfabric"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
